name: Keep Supabase Active
on:
  schedule:
    - cron: '0 8 */3 * *' # Se ejecuta cada 3 días a las 8:00 AM UTC
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          curl -s -o /dev/null -w "%{http_code}" \
            "${{ secrets.PUBLIC_SUPABASE_URL }}/rest/v1/sedes?select=id&limit=1" \
            -H "apikey: ${{ secrets.PUBLIC_SUPABASE_ANON_KEY }}"
